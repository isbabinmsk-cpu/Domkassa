<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Учёт домашних финансов - Профессиональное приложение</title>
    <link rel="stylesheet" href="css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="header">
            <div class="header-content">
                <div class="logo">
                    <button id="mobileMenuToggle" class="btn-icon mobile-menu-btn" title="Меню">☰</button>
                    <span class="logo-icon">💰</span>
                    <h1>Финансовый Учёт</h1>
                </div>
                <div class="header-actions">
                    <button id="themeToggle" class="btn-icon" title="Переключить тему">🌙</button>
                    <button id="exportBtn" class="btn btn-secondary">Экспорт</button>
                    <button id="importBtn" class="btn btn-secondary">Импорт</button>
                    <input type="file" id="importFile" accept=".json" style="display: none;">
                </div>
            </div>
        </header>

        <!-- Mobile Navigation Tabs -->
        <nav id="mobileNav" class="mobile-nav">
            <button class="nav-tab active" data-section="dashboard">📊 Главная</button>
            <button class="nav-tab" data-section="add">➕ Добавить</button>
            <button class="nav-tab" data-section="transactions">📋 Операции</button>
            <button class="nav-tab" data-section="analytics">📈 Аналитика</button>
            <button class="nav-tab" data-section="budgets">💰 Бюджеты</button>
        </nav>

        <!-- Dashboard -->
        <section class="dashboard" data-section="dashboard">
            <div class="stats-grid">
                <div class="stat-card income">
                    <div class="stat-icon">📈</div>
                    <div class="stat-info">
                        <span class="stat-label">Доходы</span>
                        <span class="stat-value" id="totalIncome">0 ₽</span>
                    </div>
                </div>
                <div class="stat-card expense">
                    <div class="stat-icon">📉</div>
                    <div class="stat-info">
                        <span class="stat-label">Расходы</span>
                        <span class="stat-value" id="totalExpense">0 ₽</span>
                    </div>
                </div>
                <div class="stat-card balance positive" id="balanceCard">
                    <div class="stat-icon">💳</div>
                    <div class="stat-info">
                        <span class="stat-label">Баланс</span>
                        <span class="stat-value" id="totalBalance">0 ₽</span>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon">📊</div>
                    <div class="stat-info">
                        <span class="stat-label">Операций</span>
                        <span class="stat-value" id="totalTransactions">0</span>
                    </div>
                </div>
            </div>
        </section>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Add Transaction Form -->
            <section class="form-section" data-section="add">
                <h2 class="section-title">Добавить операцию</h2>
                <form id="transactionForm" class="transaction-form">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="type">Тип операции</label>
                            <select id="type" required>
                                <option value="income">Доход</option>
                                <option value="expense">Расход</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="amount">Сумма (₽)</label>
                            <input type="number" id="amount" min="0.01" step="0.01" placeholder="0.00" required>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="category">Категория</label>
                            <select id="category" required>
                                <option value="">Выберите категорию</option>
                                <optgroup label="Доходы">
                                    <option value="salary">Зарплата</option>
                                    <option value="freelance">Фриланс</option>
                                    <option value="investments">Инвестиции</option>
                                    <option value="gifts">Подарки</option>
                                    <option value="other_income">Другое</option>
                                </optgroup>
                                <optgroup label="Расходы">
                                    <option value="food">Продукты</option>
                                    <option value="transport">Транспорт</option>
                                    <option value="utilities">Коммунальные услуги</option>
                                    <option value="entertainment">Развлечения</option>
                                    <option value="shopping">Покупки</option>
                                    <option value="health">Здоровье</option>
                                    <option value="education">Образование</option>
                                    <option value="travel">Путешествия</option>
                                    <option value="other_expense">Другое</option>
                                </optgroup>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="description">Описание</label>
                            <input type="text" id="description" placeholder="Краткое описание">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="date">Дата</label>
                            <input type="date" id="date" required>
                        </div>
                        <div class="form-group">
                            <label for="account">Счёт</label>
                            <select id="account" required>
                                <option value="cash">Наличные</option>
                                <option value="bank_card">Банковская карта</option>
                                <option value="bank_account">Банковский счёт</option>
                                <option value="electronic">Электронный кошелёк</option>
                            </select>
                        </div>
                        <div class="form-group form-group-btn">
                            <label>&nbsp;</label>
                            <button type="submit" class="btn btn-primary">Добавить</button>
                        </div>
                    </div>
                </form>
            </section>

            <!-- Filters and Search -->
            <section class="filters-section">
                <div class="filters-row">
                    <div class="search-box">
                        <input type="text" id="searchInput" placeholder="Поиск по описанию...">
                        <span class="search-icon">🔍</span>
                    </div>
                    <div class="filters-group">
                        <select id="filterType">
                            <option value="all">Все типы</option>
                            <option value="income">Доходы</option>
                            <option value="expense">Расходы</option>
                        </select>
                        <select id="filterCategory">
                            <option value="all">Все категории</option>
                        </select>
                        <select id="filterAccount">
                            <option value="all">Все счета</option>
                            <option value="cash">Наличные</option>
                            <option value="bank_card">Банковская карта</option>
                            <option value="bank_account">Банковский счёт</option>
                            <option value="electronic">Электронный кошелёк</option>
                        </select>
                        <div class="date-range">
                            <input type="date" id="dateFrom" placeholder="С даты">
                            <input type="date" id="dateTo" placeholder="По дату">
                        </div>
                        <button id="clearFilters" class="btn btn-secondary">Сбросить</button>
                    </div>
                </div>
            </section>

            <!-- Transactions List -->
            <section class="transactions-section" data-section="transactions">
                <div class="section-header">
                    <h2 class="section-title">История операций</h2>
                    <div class="view-options">
                        <button id="viewList" class="btn-icon active" title="Список">📋</button>
                        <button id="viewGrid" class="btn-icon" title="Плитка">▦</button>
                    </div>
                </div>
                <div id="transactionsContainer" class="transactions-container list-view">
                    <!-- Transactions will be rendered here -->
                </div>
                <div id="pagination" class="pagination"></div>
            </section>

            <!-- Analytics Section -->
            <section class="analytics-section" data-section="analytics">
                <h2 class="section-title">Аналитика</h2>
                <div class="analytics-grid">
                    <div class="chart-card">
                        <h3>Категории расходов</h3>
                        <canvas id="expenseChart"></canvas>
                    </div>
                    <div class="chart-card">
                        <h3>Динамика доходов/расходов</h3>
                        <canvas id="trendChart"></canvas>
                    </div>
                </div>
            </section>

            <!-- Budget Section -->
            <section class="budget-section" data-section="budgets">
                <h2 class="section-title">Бюджеты по категориям</h2>
                <div id="budgetsContainer" class="budgets-grid">
                    <!-- Budget cards will be rendered here -->
                </div>
                <button id="addBudgetBtn" class="btn btn-primary">Добавить бюджет</button>
            </section>
        </main>

        <!-- Footer -->
        <footer class="footer" data-section="footer">
            <p>&copy; 2024 Финансовый Учёт. Все данные хранятся локально.</p>
        </footer>
    </div>

    <!-- Modal for Budget -->
    <div id="budgetModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Управление бюджетом</h3>
                <button class="modal-close">&times;</button>
            </div>
            <form id="budgetForm">
                <div class="form-group">
                    <label for="budgetCategory">Категория</label>
                    <select id="budgetCategory" required>
                        <option value="food">Продукты</option>
                        <option value="transport">Транспорт</option>
                        <option value="utilities">Коммунальные услуги</option>
                        <option value="entertainment">Развлечения</option>
                        <option value="shopping">Покупки</option>
                        <option value="health">Здоровье</option>
                        <option value="education">Образование</option>
                        <option value="travel">Путешествия</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="budgetAmount">Лимит (₽)</label>
                    <input type="number" id="budgetAmount" min="1" required>
                </div>
                <div class="form-group">
                    <label for="budgetPeriod">Период</label>
                    <select id="budgetPeriod">
                        <option value="month">Месяц</option>
                        <option value="week">Неделя</option>
                    </select>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn btn-secondary modal-close">Отмена</button>
                    <button type="submit" class="btn btn-primary">Сохранить</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Toast Notifications -->
    <div id="toastContainer" class="toast-container"></div>

    <script type="module" src="js/main.js?v=1.0.0"></script>
</body>
</html>
